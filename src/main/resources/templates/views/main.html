<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Aalto 서비스 메인 v2.0">
    <meta property="og:type" content="website">
    <meta property="og:image" content="image/meta.png">
    <meta property="og:description" content="※aSSIST 외부 공유 금지※">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon">
    <title>Aalto 서비스 메인</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css" />

    <style>
        /* 진한 보라색 그라데이션 카드 스타일 */
        .menu-card {
            background: linear-gradient(135deg, #4b1248 0%, #1f0449 100%);
            border-radius: 1.25rem; /* 곡률 지정 */
            color: #ffffff; /* 흰색 글씨 */
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(31, 4, 73, 0.3) !important;
            color: #ffffff;
        }

        .menu-card .icon-wrapper {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column justify-content-between">

<div class="container py-5 my-auto">
    <div class="row justify-content-center text-center mb-5">
        <div class="col-lg-8">
            <span class="badge bg-secondary-subtle text-secondary-emphasis px-3 py-2 rounded-pill fw-semibold mb-2">Aalto EMBA</span>
            <h1 class="display-6 fw-bold">서비스 선택</h1>
            <p class="text-muted">원하시는 작업 서비스를 선택해주세요.</p>
        </div>
    </div>

    <div class="row justify-content-center g-4">
        <!-- 조편성 바로가기 카드 -->
        <div class="col-md-5 col-lg-4">
            <a href="group" class="card menu-card shadow p-4 text-center h-100">
                <div class="card-body d-flex flex-column justify-content-center align-items-center py-4">
                    <div class="icon-wrapper">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <h2 class="h4 fw-bold mb-2">조편성</h2>
                    <p class="mb-0 text-white-50 small">성비 및 이전 조편성을 고려한 스마트 조편성 프로그램</p>
                </div>
            </a>
        </div>

        <!-- PDF 암호화 바로가기 카드 -->
        <div class="col-md-5 col-lg-4">
            <a href="encrypt" class="card menu-card shadow p-4 text-center h-100">
                <div class="card-body d-flex flex-column justify-content-center align-items-center py-4">
                    <div class="icon-wrapper">
                        <i class="bi bi-file-earmark-lock2-fill"></i>
                    </div>
                    <h2 class="h4 fw-bold mb-2">PDF 암호화</h2>
                    <p class="mb-0 text-white-50 small">문서 보안 강화를 위한 PDF 암호화 서비스</p>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- footer -->
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
